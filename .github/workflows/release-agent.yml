name: Release Agent

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  propose-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for existing open release proposals
        id: check_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --label "release-agent" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "issue_number=$EXISTING_ISSUE" >> $GITHUB_OUTPUT

      - name: Run Release Agent
        env:
          # A manual dispatch means "I want a proposal now": bypass the
          # chore-accumulation wait (the shipped-path gate still applies).
          FORCE_PROPOSAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/release-agent.sh
          ./scripts/release-agent.sh

      - name: Create or Update Issue
        if: hashFiles('release_proposal.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.check_issues.outputs.issue_number }}
        run: |
          PROPOSED_TAG=$(grep 'Proposed Tag' release_proposal.md | cut -d' ' -f3)
          
          if [ -n "$ISSUE_NUMBER" ]; then
            # Re-editing an identical proposal just generates notification
            # noise: leave the issue untouched unless the content changed.
            CURRENT_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)
            if [ "$CURRENT_BODY" = "$(cat release_proposal.md)" ]; then
              echo "Proposal unchanged; leaving issue #$ISSUE_NUMBER untouched"
              exit 0
            fi
            echo "Updating existing issue #$ISSUE_NUMBER"
            gh issue edit "$ISSUE_NUMBER" \
              --title "Release Proposal: $PROPOSED_TAG" \
              --body-file release_proposal.md
            gh issue comment "$ISSUE_NUMBER" --body "🔄 Release proposal updated to $PROPOSED_TAG based on latest changes."
          else
            echo "Creating new issue"
            gh label create "release-agent" --color "0E8A16" --description "Issues created by the Release Agent" || true
            gh label create "release-approved" --color "0075ca" --description "Approve release proposal" || true
            gh issue create \
              --title "Release Proposal: $PROPOSED_TAG" \
              --body-file release_proposal.md \
              --label "release-agent"
          fi
