name: Publish Release

on:
  issues:
    types: [labeled]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-release:
    if: github.event.label.name == 'release-approved' && contains(github.event.issue.labels.*.name, 'release-agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Issue title and body are untrusted input (they carry commit text) and
      # must reach the shell via env, never by templating them into the script.
      - name: Extract Version
        id: get_version
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          VERSION=$(grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' <<< "$TITLE" | head -1)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from title '$TITLE'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          NOTES: ${{ github.event.issue.body }}
        run: |
          gh release create "$VERSION" \
            --target main \
            --title "$VERSION" \
            --notes "$NOTES"

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE" --comment "🚀 Release $VERSION has been published!"

  call-docker-publish:
    needs: publish-release
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.publish-release.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
